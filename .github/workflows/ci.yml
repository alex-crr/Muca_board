name: KiCad CI (Fast Checks & PR Visual Diff)

on:
  push:
    branches:
      - "**"
    paths:
      - "**.kicad_*"
      - "assets/**"
      - "*lib-table"
      - "ci/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - "**"
    paths:
      - "**.kicad_*"
      - "assets/**"
      - "*lib-table"
      - "ci/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: kicad-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    name: ERC, DRC, Sanity & Visual Diff
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.8
      options: --user 0:0

    steps:
      - name: Checkout head (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Python CI dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            python3-yaml \
            python3-pil \
            python3-markdown

      - name: Run ERC & DRC (KiCad 10)
        id: checks
        run: |
          set +e
          python3 ci/scripts/parse_checks.py --out-dir build/reports
          rc=$?
          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Audit BOM, LCSC Conflicts & Local Library Tables
        run: |
          SHORT_SHA=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
          python3 ci/scripts/build_jlcpcb.py \
            --out-dir build/bom-check \
            --version "${SHORT_SHA}" \
            --bom-only
          python3 ci/scripts/sanity_checks.py \
            --bom-json build/bom-check/bom-merged.json \
            --out-dir build/reports

      - name: Detect KiCad changes on PR
        if: github.event_name == 'pull_request'
        id: changed
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- '*.kicad_sch' '*.kicad_pcb' || true)
          if [ -n "$CHANGED" ]; then
            echo "kicad_changed=true" >> "$GITHUB_OUTPUT"
            echo "Changed KiCad files:"
            echo "$CHANGED"
          else
            echo "kicad_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Visual PCB / Schematic Diff (PR only)
        if: github.event_name == 'pull_request' && steps.changed.outputs.kicad_changed == 'true'
        run: |
          apt-get install -y -qq --no-install-recommends librsvg2-bin >/dev/null 2>&1 || true
          rm -rf /tmp/base_repo
          git worktree add --detach /tmp/base_repo "origin/${{ github.base_ref }}"
          python3 ci/scripts/visual_diff.py \
            --base-dir /tmp/base_repo \
            --head-dir "$PWD" \
            --out-dir build/visual-diff
          git worktree remove --force /tmp/base_repo || rm -rf /tmp/base_repo

      - name: Upload ERC/DRC & Sanity Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erc-drc-reports
          path: |
            build/reports/
            build/bom-check/bom-merged.json
          retention-days: 14

      - name: Upload PR Visual Diff Artifact
        if: github.event_name == 'pull_request' && steps.changed.outputs.kicad_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: |
            build/visual-diff/visual-diff.html
            build/visual-diff/diff-summary.md
            build/visual-diff/diff-summary.json
            build/visual-diff/images/
          retention-days: 14

      - name: Post / Update PR Summary Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- kicad-ci-summary -->';
            const parts = [marker];

            if (fs.existsSync('build/reports/checks-summary.md')) {
              parts.push(fs.readFileSync('build/reports/checks-summary.md', 'utf8'));
            }
            if (fs.existsSync('build/reports/sanity-summary.md')) {
              parts.push(fs.readFileSync('build/reports/sanity-summary.md', 'utf8'));
            }
            if (fs.existsSync('build/visual-diff/diff-summary.md')) {
              parts.push(fs.readFileSync('build/visual-diff/diff-summary.md', 'utf8'));
            }

            const body = parts.join('\n\n---\n\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Enforce Optional Strict Gate (if enabled in ci/config.yml)
        if: steps.checks.outputs.exit_code != '0'
        run: |
          echo "::error::Strict ERC/DRC gate is enabled in ci/config.yml and errors were detected."
          exit 1
